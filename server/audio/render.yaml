services:
  - type: web
    name: moji-pv-audio
    runtime: docker
    plan: standard
    dockerfilePath: ./server/audio/Dockerfile
    dockerContext: ./server/audio
    healthCheckPath: /health
    envVars:
      - key: AUDIO_SERVER_TOKEN
        generateValue: true
      - key: AUDIO_ALLOWED_ORIGINS
        value: https://momomonbi.github.io
      - key: AUDIO_MAX_UPLOAD_BYTES
        value: "268435456"
      - key: AUDIO_MAX_CONCURRENT
        value: "1"
      - key: AUDIO_FFMPEG_THREADS
        value: "2"
      - key: AUDIO_CONVERSION_TIMEOUT_SECONDS
        value: "1800"
