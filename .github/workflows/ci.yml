# 文字PVメーカー v2 — original work. CI (DESIGN §8).
# Every pull request and every push to main runs the quick job (about 5 minutes): build.py --check · Node tests ·
# build.py --lab · build.py (the committed pages must match the build) · build_test.py.
# The browser tests (about 13 minutes) run only when started by hand: Actions → CI → Run workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint, layers and module order
        run: python3 build.py --check

      - name: Node tests
        # The speed budgets (planner_determinism, mix, …) are measured on a CPU that no other test file shares: run side
        # by side, a re-plan measured 10–16 ms against the 10 ms budget; alone it measures 5–6 ms. So the files that time
        # themselves run one at a time first, then every other file runs side by side.
        run: |
          timed=()
          for n in planner_determinism mix reconcile script media_engine timing; do
            timed+=("tests/node/$n.test.js")
          done
          rest=()
          for f in tests/node/*.test.js; do
            [[ " ${timed[*]} " == *" $f "* ]] || rest+=("$f")
          done
          status=0
          node --test --test-concurrency=1 "${timed[@]}" || status=1
          node --test --test-concurrency=4 "${rest[@]}" || status=1
          exit $status

      - name: Build the lab page
        run: python3 build.py --lab

      - name: Build the pages (the committed index.html and en/index.html must match)
        run: |
          python3 build.py
          git ls-files --error-unmatch index.html en/index.html > /dev/null
          if ! git diff --exit-code --stat -- index.html en/index.html; then
            echo "::error::index.html / en/index.html differ from the build: run python3 build.py and commit the pages"
            exit 1
          fi

      - name: Build tests
        run: python3 tests/build_test.py

  browser:
    # Only when started by hand (Actions → CI → Run workflow).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright (Python; drives the runner's Google Chrome, no browser download)
        run: python3 -m pip install --quiet playwright

      - name: Google Chrome
        run: google-chrome --version

      - name: Japanese and emoji fonts (the system fallback a user's machine has)
        # The browser tests block Google Fonts, so the text draws with the system fallback. ubuntu-latest has no CJK font:
        # Chrome's `serif` is Liberation Serif there, whose missing-glyph box is empty, so Japanese in a mincho face drew
        # nothing at all. The tests fail fast with one message when no font draws Japanese (dev/browser.py).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f
          fc-list :lang=ja family | sort -u | head -n 5

      - name: Build the lab page and the pages
        run: |
          python3 build.py --lab
          python3 build.py

      - name: Browser tests
        # Every tests/browser/*.py with its default arguments, in name order. Google Chrome encodes H.264 (no AAC on
        # Linux), so export_check runs its H.264 branch (the MP4 checked without sound) and ui_flows its first-run MP4;
        # MV_REQUIRE_H264 makes either fail instead of skipping without an H.264 encoder.
        # Every test runs; the step fails at the end when any of them failed.
        env:
          PW_CHANNEL: chrome
          MV_REQUIRE_H264: '1'
        run: |
          shopt -s nullglob
          files=(tests/browser/*.py)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no browser tests found"; exit 1; fi
          failed=()
          for f in "${files[@]}"; do
            echo "::group::$f"
            python3 "$f" || failed+=("$f")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            for f in "${failed[@]}"; do echo "::error file=$f::$f failed"; done
            exit 1
          fi
