# 文字PVメーカー v2 — original work. CI (DESIGN §8), in order: build.py --check · Node tests · build.py --lab ·
# build.py (the committed pages must match the build) · every browser test with its default arguments (Google Chrome,
# so the H.264 exports run) · build_test.py.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright (Python; drives the runner's Google Chrome, no browser download)
        run: python3 -m pip install --quiet playwright

      - name: Google Chrome
        run: google-chrome --version

      - name: Japanese and emoji fonts (the system fallback a user's machine has)
        # The browser tests block Google Fonts, so the text draws with the system fallback. ubuntu-latest has no CJK font:
        # Chrome's `serif` is Liberation Serif there, whose missing-glyph box is empty, so Japanese in a mincho face drew
        # nothing at all. The tests fail fast with one message when no font draws Japanese (dev/browser.py).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk fonts-noto-color-emoji
          fc-cache -f
          fc-list :lang=ja family | sort -u | head -n 5

      - name: Lint, layers and module order
        run: python3 build.py --check

      - name: Node tests
        # The glob reports every test. `node --test tests/node` also works: Node 22 loads tests/node/index.js, which
        # runs each file in its own process and reports one result per file.
        run: node --test "tests/node/*.test.js"

      - name: Build the lab page
        run: python3 build.py --lab

      - name: Build the pages (the committed index.html and en/index.html must match)
        run: |
          python3 build.py
          git ls-files --error-unmatch index.html en/index.html > /dev/null
          if ! git diff --exit-code --stat -- index.html en/index.html; then
            echo "::error::index.html / en/index.html differ from the build: run python3 build.py and commit the pages"
            exit 1
          fi

      - name: Browser tests
        # Every tests/browser/*.py with its default arguments, in name order: contact_sheet (self-check), csp,
        # determinism, export_check, fx_parts, glyph_parity, ground_contrast, i18n_pages, parts_gallery, perf,
        # transparent_check, ui_flows, ui_layout. Google Chrome encodes H.264 (no AAC on Linux), so export_check runs its
        # H.264 branch (the MP4 checked without sound) and ui_flows its first-run MP4; MV_REQUIRE_H264 makes either fail
        # instead of skipping without an H.264 encoder.
        # Every test runs; the step fails at the end when any of them failed.
        env:
          PW_CHANNEL: chrome
          MV_REQUIRE_H264: '1'
        run: |
          shopt -s nullglob
          files=(tests/browser/*.py)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no browser tests found"; exit 1; fi
          failed=()
          for f in "${files[@]}"; do
            echo "::group::$f"
            python3 "$f" || failed+=("$f")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            for f in "${failed[@]}"; do echo "::error file=$f::$f failed"; done
            exit 1
          fi

      - name: Build tests
        run: python3 tests/build_test.py
